<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ເຂົ້າສູ່ລະບົບ – ຫຼັງບ້ານ DN Game Vault</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;800&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<main class="auth">
  <form id="login" class="card">
    <div class="brand"><img src="assets/img/logo.png" alt="" width="36" height="36"> DN Game Vault <small>ຫຼັງບ້ານ</small></div>
    <p class="muted">ເຂົ້າສູ່ລະບົບເພື່ອຈັດການສິນຄ້າ ແລະ ອໍເດີ</p>
    <input id="email" type="email" placeholder="ອີເມວ" required autocomplete="username">
    <input id="pass" type="password" placeholder="ລະຫັດຜ່ານ" required autocomplete="current-password">
    <button class="btn" id="go">ເຂົ້າສູ່ລະບົບ</button>
    <p id="msg" class="err" role="alert"></p>
    <a class="muted" id="backlink" href="#" hidden>← ກັບໄປໜ້າຮ້ານ</a>
  </form>
</main>
<script type="module" src="assets/js/login.js"></script>
</body>
</html>
